name: Build and release Move UI

on:
  pull_request:
    branches: [main]
    paths:
      - "*.lua"
      - "*.xml"
      - "MoveUI.toc"
      - ".github/workflows/package-moveui-test.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assemble and validate installable addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/MoveUI
          cp MoveUI.toc MoveAnything.xml MoveAnything.lua MoveUIFrameCatalog.lua MoveUIRunClock.lua MAPredefinedFrames.lua MoveUIFrameRegistry.lua MoveUIMover.lua MoveUIVisibility.lua MoveUICompatibilityHooks.lua MoveUICommands.lua MoveAnythingGrid.lua MoveUIAddonTools.lua MoveUIMinimapButton.lua MoveUIAddonIntegration.lua dist/MoveUI/
          test "$(find dist/MoveUI -maxdepth 1 -type f | wc -l)" -eq 15
          test -f dist/MoveUI/MoveUI.toc
          VERSION="$(awk '/^## Version:/ { print $3 }' MoveUI.toc)"
          VERSION="${VERSION%-dev}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          (cd dist && zip -qr "../MoveUI-$VERSION.zip" MoveUI)
          unzip -t "MoveUI-$VERSION.zip"
          unzip -l "MoveUI-$VERSION.zip" | grep -q "MoveUI/MoveUI.toc"

      - name: Upload test build
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: MoveUI-${{ env.VERSION }}-test
          path: MoveUI-${{ env.VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Move UI ${{ github.ref_name }}
          generate_release_notes: true
          files: MoveUI-*.zip

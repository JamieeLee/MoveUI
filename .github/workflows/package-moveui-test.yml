name: Package Move UI

on:
  push:
    branches:
      - feature/addon-tools-integration
      - refactor/modular-architecture
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assemble clean addon folder
        shell: bash
        run: |
          mkdir -p dist/MoveUI
          cp MoveUI.toc MoveAnything.xml MoveAnything.lua MoveUIFrameCatalog.lua MoveUIRunClock.lua MAPredefinedFrames.lua MoveUIFrameRegistry.lua MoveUIMover.lua MoveUIVisibility.lua MoveUICompatibilityHooks.lua MoveUICommands.lua MoveAnythingGrid.lua MoveUIAddonTools.lua MoveUIMinimapButton.lua MoveUIAddonIntegration.lua dist/MoveUI/
          test "$(find dist/MoveUI -maxdepth 1 -type f | wc -l)" -eq 15

      - name: Create test ZIP
        id: test_zip
        if: startsWith(github.ref, 'refs/heads/')
        shell: bash
        run: |
          VERSION="$(awk '/^## Version:/ { print $3 }' MoveUI.toc)"
          VERSION="${VERSION%-dev}"
          ARCHIVE="MoveUI-${VERSION}-Refactor-Test.zip"
          cd dist
          zip -qr "../${ARCHIVE}" MoveUI
          echo "archive_name=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload test ZIP to GitHub Actions
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: MoveUI-1.3.0-Refactor-Test
          path: ${{ steps.test_zip.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Create release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -qr "../MoveUI-${VERSION}.zip" MoveUI

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Move UI ${{ github.ref_name }}
          generate_release_notes: true
          files: MoveUI-*.zip
